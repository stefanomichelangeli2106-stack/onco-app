<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Consultorio Onco — Simulador clínico oncológico</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F332F">
<meta name="color-scheme" content="light">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onco">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#EFEAE0; --paper-2:#F7F3EA; --ink:#26241F; --ink-soft:#5B584E; --line:#D8D2C2;
    --teal:#1B4B47; --teal-deep:#0F332F; --teal-tint:#DCE9E6;
    --coral:#B8462B; --coral-tint:#F4DFD6;
    --sage:#4B6B47; --sage-tint:#E1E9DA;
    --gold:#9C7A2E; --gold-tint:#F1E6C8;
    --plum:#6B4468; --plum-tint:#E9DEE7;
    --steel:#3E5A6B; --steel-tint:#DEE7EA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));}
  .masthead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .masthead h1{font-family:'Lora',serif;font-weight:600;font-size:26px;margin:0;letter-spacing:.2px;cursor:pointer;}
  .masthead .sub{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1.5px;}

  .crumb{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .crumb span{cursor:pointer;text-decoration:underline;}
  .intro{font-family:'Lora',serif;font-size:16px;line-height:1.7;color:var(--ink-soft);max-width:640px;margin:0 0 26px;}

  .sectiongrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:640px){.sectiongrid{grid-template-columns:1fr;}}
  .sectioncard{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:28px 26px;cursor:pointer;transition:border-color .12s,transform .12s;text-align:left;}
  .sectioncard:hover{border-color:var(--ink-soft);transform:translateY(-1px);}
  .sectioncard .icon{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);margin-bottom:10px;display:block;}
  .sectioncard h2{font-family:'Lora',serif;font-size:23px;margin:0 0 8px;}
  .sectioncard p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .sectioncard.pulmon .icon{color:var(--steel);}

  .modgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .casegrid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media (max-width:640px){.modgrid{grid-template-columns:1fr;}}
  .modcard{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:20px 22px;cursor:pointer;transition:border-color .12s,transform .12s;text-align:left;}
  .modcard:hover{border-color:var(--ink-soft);transform:translateY(-1px);}
  .modcard .tag{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:10px;}
  .modcard h3{font-family:'Lora',serif;font-size:19px;margin:0 0 8px;}
  .modcard p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin:0;}
  .tag.lumA{background:var(--teal-tint);color:var(--teal-deep);}
  .tag.lumB{background:var(--gold-tint);color:var(--gold);}
  .tag.her2{background:var(--plum-tint);color:var(--plum);}
  .tag.tnbc{background:var(--coral-tint);color:#7A2E19;}
  .tag.egfr{background:var(--teal-tint);color:var(--teal-deep);}
  .tag.alk{background:var(--plum-tint);color:var(--plum);}
  .tag.nodriver{background:var(--gold-tint);color:var(--gold);}
  .tag.sclc{background:var(--coral-tint);color:#7A2E19;}
  .casecard{display:flex;gap:14px;align-items:flex-start;}
  .casecard .casenum{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--line);font-weight:500;flex-shrink:0;}
  .casecard:hover .casenum{color:var(--teal);}

  .theory-link{display:flex;align-items:center;gap:14px;background:var(--gold-tint);border:1px solid var(--gold);border-radius:8px;padding:14px 18px;margin:0 0 20px;text-decoration:none;color:var(--ink);transition:border-color .12s,transform .12s;}
  .theory-link:hover{transform:translateY(-1px);}
  .theory-link .theory-icon{font-size:22px;flex-shrink:0;}
  .theory-link b{display:block;font-size:14px;font-weight:600;color:var(--ink);}
  .theory-link small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .layout{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start;}
  @media (max-width:760px){.layout{grid-template-columns:1fr;}}

  .chart{position:sticky;top:16px;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .chart-head{background:var(--teal-deep);color:var(--paper-2);padding:12px 14px;font-family:'Lora',serif;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .chart-head .head-actions{display:flex;gap:12px;align-items:center;flex-shrink:0;}
  .chart-head .back{font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:400;text-decoration:underline;cursor:pointer;opacity:.85;}
  .chart-head .toggle{font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:400;text-decoration:underline;cursor:pointer;opacity:.85;display:none;}
  .chart-body{padding:14px;}
  @media (max-width:760px){
    .chart-head .toggle{display:inline-block;}
    .chart .chart-body{display:none;}
    .chart.open .chart-body{display:block;}
  }
  .patient-row{font-size:13px;line-height:1.5;color:var(--ink-soft);margin-bottom:10px;}
  .patient-row b{color:var(--ink);}
  .vitals{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--ink);color:#EDE7D5;border-radius:4px;padding:10px 12px;margin:10px 0;}
  .vitals div{display:flex;justify-content:space-between;padding:1.5px 0;gap:8px;}
  .vitals span.k{opacity:.65;flex-shrink:0;}
  .vitals span.v{font-weight:500;text-align:right;}
  .timeline{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;}
  .tl-item{display:flex;gap:8px;font-size:12px;padding:5px 0;color:var(--ink-soft);}
  .tl-dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:3px;flex-shrink:0;}
  .tl-item.done .tl-dot{background:var(--teal);}
  .tl-item.done{color:var(--ink);}
  .tl-item.tox .tl-dot{background:var(--coral);}
  .score-box{margin-top:12px;background:var(--gold-tint);border:1px solid var(--gold);border-radius:4px;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;}
  .score-box b{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--gold);}

  .panel{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:26px 28px;}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);font-weight:600;margin-bottom:8px;}
  .eyebrow.tox{color:var(--coral);}
  .narrative{font-family:'Lora',serif;font-size:16.5px;line-height:1.7;color:var(--ink);}
  .narrative p{margin:0 0 14px;}
  .narrative b{font-weight:600;}
  .callout{border-left:3px solid var(--teal);background:var(--teal-tint);padding:10px 14px;border-radius:0 4px 4px 0;font-size:14px;margin:16px 0;color:var(--teal-deep);}
  .callout.warn{border-color:var(--coral);background:var(--coral-tint);color:#7A2E19;}
  .callout.good{border-color:var(--sage);background:var(--sage-tint);color:#2E4A2B;}

  .options{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .opt{text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:13px 16px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:var(--ink);transition:border-color .12s;display:flex;gap:12px;align-items:flex-start;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt .letter{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--teal);flex-shrink:0;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--sage-tint);border-color:var(--sage);}
  .opt.partial{background:var(--gold-tint);border-color:var(--gold);}
  .opt.incorrect{background:var(--coral-tint);border-color:var(--coral);}
  .opt.neutral-off{opacity:.5;}

  .feedback{margin-top:16px;padding:14px 16px;border-radius:5px;font-size:14px;line-height:1.6;}
  .feedback.correct{background:var(--sage-tint);border:1px solid var(--sage);color:#2E4A2B;}
  .feedback.partial{background:var(--gold-tint);border:1px solid var(--gold);color:#5C4713;}
  .feedback.incorrect{background:var(--coral-tint);border:1px solid var(--coral);color:#7A2E19;}
  .feedback .tag2{font-weight:600;display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}

  .bestref{margin-top:10px;padding:10px 14px;border-radius:5px;font-size:13px;background:var(--paper);border:1px dashed var(--line);color:var(--ink-soft);}
  .bestref b{color:var(--ink);}

  .evidence{margin-top:10px;background:var(--ink);color:#EDE7D5;border-radius:5px;padding:11px 14px;font-size:12.5px;line-height:1.55;}
  .evidence .ev-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;opacity:.6;display:block;margin-bottom:4px;}
  .evidence .ev-study{font-weight:500;color:#F1E6C8;}

  .next-btn{margin-top:20px;background:var(--teal);color:#fff;border:none;padding:11px 22px;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
  .next-btn:hover{background:var(--teal-deep);}
  .ghost-btn{margin-top:12px;margin-left:10px;background:transparent;color:var(--ink-soft);border:1px solid var(--line);padding:10px 18px;border-radius:5px;font-size:13px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}

  .epicrisis h2{font-family:'Lora',serif;font-size:20px;margin:0 0 4px;}
  .epicrisis .grade{font-family:'IBM Plex Mono',monospace;font-size:34px;color:var(--teal);margin:10px 0;}
  .refs{margin-top:20px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;line-height:1.8;}
  .refs b{color:var(--ink);}

  .masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .userbar{font-size:11.5px;color:var(--ink-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .userbar .email{color:var(--ink-soft);}
  .userbar button{background:none;border:none;padding:0;font:inherit;font-family:'IBM Plex Sans',sans-serif;color:var(--teal);text-decoration:underline;cursor:pointer;}

  .auth-card{max-width:380px;margin:20px auto 0;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:30px 28px;}
  .auth-card h2{font-family:'Lora',serif;font-size:21px;margin:0 0 6px;}
  .auth-card .sub2{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 22px;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .auth-field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;background:var(--paper);color:var(--ink);}
  .auth-field input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .auth-error{background:var(--coral-tint);color:#7A2E19;border:1px solid var(--coral);border-radius:5px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .auth-success{background:var(--sage-tint);color:#2E4A2B;border:1px solid var(--sage);border-radius:5px;padding:9px 12px;font-size:13px;line-height:1.5;margin-bottom:14px;}
  .auth-toggle{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:16px;}
  .auth-toggle span{color:var(--teal);text-decoration:underline;cursor:pointer;}

  .history-item{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .history-item .hi-main{font-size:14px;}
  .history-item .hi-main b{color:var(--ink);}
  .history-item .hi-date{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .history-item .hi-score{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--teal);font-size:15px;flex-shrink:0;}
  .history-empty{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1 id="titleHome">Consultorio Onco</h1>
    <div class="masthead-right">
      <div class="sub">Simulador clínico oncológico</div>
      <div class="userbar" id="userBar"></div>
    </div>
  </div>
  <div id="app"><p class="intro">Cargando…</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
const MAMA_MODULES = {

/* ============================================================ LUMINAL A */
lumA: {
  tag:"lumA", tagLabel:"Luminal A", title:"Luminal A",
  moduleDesc:"RE/RP muy positivos, Ki67 bajo, HER2 negativo. El subtipo de mejor pronóstico y menor sensibilidad a quimioterapia.",
  cases: [

  { key:"classic", label:"Caso 1",
    cardDesc:"58 años, posmenopáusica. Diagnóstico inicial de cáncer de mama Luminal A en estadio temprano.",
    patient:"M.R., 58 años · posmenopáusica<br>Motivo: nódulo palpable, mama izquierda",
    vitals:{"RE / RP":"95% / 80%","HER2":"negativo (IHQ 1+)","Ki67":"8%","Subtipo":"Luminal A","Estadio":"cT2N0","Tratamiento":"—"},
    timeline:["Diagnóstico","Abordaje inicial","Adyuvancia sistémica","Terapia endocrina","1ª línea metastásica","Manejo de toxicidad","2ª línea metastásica","Epicrisis"],
    stages:[
      {type:"info", phase:0, eyebrow:"Consulta inicial", html:`
        <p>M.R., 58 años, posmenopáusica sin antecedentes relevantes, consulta por un nódulo palpable en el cuadrante superoexterno de la mama izquierda de 3 semanas de evolución, indoloro.</p>
        <p>La <b>mamografía y ecografía</b> muestran una lesión sólida irregular de 2.3 cm, BI-RADS 5. <b>Biopsia core</b>: carcinoma ductal infiltrante, grado 2.</p>
        <p>Perfil: <b>RE 95%, RP 80%, HER2 negativo (IHQ 1+), Ki67 8%</b>. Axila clínicamente negativa (cN0).</p>
        <div class="callout">Receptores hormonales muy positivos, HER2 negativo, Ki67 bajo: <b>Luminal A</b>, el de mejor pronóstico y menor sensibilidad relativa a la quimioterapia.</div>`, buttonLabel:"Continuar a la primera decisión →"},
      {type:"decision", phase:1, eyebrow:"Decisión 1 · Abordaje inicial",
        prompt:"Con este perfil (Luminal A, cT2N0, sin indicación de reducción tumoral urgente), ¿cuál es la conducta inicial más apropiada?",
        options:[
          {label:"Cirugía primero (tumorectomía + biopsia de ganglio centinela)", points:2,
            feedback:"Correcto. Los tumores luminal A tienen tasas de respuesta patológica completa muy bajas con quimioterapia neoadyuvante; operar de entrada permite la estadificación patológica definitiva.",
            paper:"Rouzier et al., Clin Cancer Res 2005", finding:"La respuesta patológica completa a quimioterapia preoperatoria varía según el subtipo molecular, siendo mínima en tumores luminales de baja proliferación."},
          {label:"Quimioterapia neoadyuvante estándar", points:0,
            feedback:"La baja proliferación (Ki67 8%) predice pobre respuesta a quimioterapia; sería sobretratamiento.",
            paper:"Rouzier et al., Clin Cancer Res 2005", finding:"Los tumores luminales de baja proliferación tuvieron las tasas más bajas de respuesta patológica completa entre todos los subtipos."},
          {label:"Terapia endocrina neoadyuvante por varios meses", points:1,
            feedback:"Alternativa razonable en casos seleccionados, pero no la primera línea aquí: el tumor ya es operable de entrada.",
            paper:"ACOSOG Z1031 — Ellis et al., J Clin Oncol 2011", finding:"La terapia endocrina neoadyuvante puede reducir el tamaño tumoral en RE+ posmenopáusicas."},
          {label:"Radioterapia como tratamiento inicial", points:0,
            feedback:"No tiene rol como tratamiento inicial en enfermedad operable.",
            paper:"—", finding:"No existe evidencia que sustente radioterapia como tratamiento primario en cáncer de mama operable."}
        ]},
      {type:"info", phase:1, eyebrow:"Resultado quirúrgico", vitalsUpdate:{"Tratamiento":"Cirugía realizada"}, html:`
        <p><b>Tumorectomía + ganglio centinela</b>: carcinoma ductal infiltrante 2.4 cm, márgenes negativos, <b>0/2 ganglios positivos (pN0)</b>. pT2N0.</p>`, buttonLabel:"Evaluar riesgo de recurrencia →"},
      {type:"decision", phase:2, eyebrow:"Decisión 2 · Adyuvancia sistémica",
        prompt:"Oncotype DX: Recurrence Score 12 (bajo). RE/RP fuertemente positivos, HER2 negativo, pN0. ¿Qué adyuvancia corresponde?",
        options:[
          {label:"Terapia endocrina sola, sin quimioterapia", points:2,
            feedback:"Correcto. Con RS bajo y N0, la quimioterapia adyuvante no aporta beneficio adicional.",
            paper:"TAILORx — Sparano et al., N Engl J Med 2018", finding:"En N0 con RS 11-25 (y más claramente en RS bajo), la quimioterapia no mejoró la supervivencia libre de enfermedad frente a terapia endocrina sola."},
          {label:"Quimioterapia seguida de terapia endocrina", points:0,
            feedback:"Sobretratamiento con RS 12 y N0.",
            paper:"TAILORx — Sparano et al., N Engl J Med 2018", finding:"El beneficio de quimioterapia solo se observó en RS 26-100, o en menores de 50 con RS 16-25."},
          {label:"Terapia endocrina + inhibidor de CDK4/6", points:0,
            feedback:"Indicado en alto riesgo; esta paciente es pN0 con RS bajo, no cumple criterios.",
            paper:"monarchE — Johnston et al., J Clin Oncol 2020", finding:"Beneficio únicamente en población de alto riesgo definida por el estudio."},
          {label:"Quimioterapia sola, sin terapia endocrina", points:0,
            feedback:"La terapia endocrina no debe omitirse en un tumor RE+.",
            paper:"EBCTCG meta-analysis, Lancet 2011", finding:"La terapia endocrina adyuvante reduce sustancialmente el riesgo de recurrencia en tumores RE+."}
        ]},
      {type:"decision", phase:3, eyebrow:"Decisión 3 · Elección de terapia endocrina adyuvante",
        prompt:"¿Cuál es la elección más apropiada de terapia endocrina en esta paciente posmenopáusica?",
        options:[
          {label:"Inhibidor de aromatasa (letrozol o anastrozol) por 5 a 10 años", points:2,
            feedback:"Correcto. En posmenopáusicas, los inhibidores de aromatasa son superiores al tamoxifeno.",
            paper:"ATAC trial — Cuzick et al., Lancet Oncol 2010", finding:"Anastrozol mostró mejor supervivencia libre de enfermedad que tamoxifeno en posmenopáusicas RE+."},
          {label:"Tamoxifeno por 5 años", points:1,
            feedback:"Válida con contraindicación a inhibidores de aromatasa, pero subóptima sin ella.",
            paper:"EBCTCG meta-analysis, Lancet Oncol 2015", finding:"Las estrategias con inhibidor de aromatasa redujeron más la recurrencia a 10 años."},
          {label:"Supresión ovárica + inhibidor de aromatasa", points:0,
            feedback:"Se reserva para premenopáusicas; esta paciente ya es posmenopáusica.",
            paper:"SOFT/TEXT — Francis et al., N Engl J Med 2018", finding:"El beneficio se demostró en premenopáusicas de riesgo alto."},
          {label:"Ninguna terapia endocrina, solo seguimiento", points:0,
            feedback:"Sería un error grave con RE 95%.",
            paper:"EBCTCG meta-analysis, Lancet 2011", finding:"La omisión de terapia endocrina en tumores RE+ se asocia a exceso de recurrencias."}
        ]},
      {type:"info", phase:4, eyebrow:"Seguimiento — 18 meses después", vitalsUpdate:{"Tratamiento":"Letrozol adyuvante","Estadio":"Sin evidencia de enfermedad"}, html:`
        <p>Dieciocho meses después consulta por <b>dolor lumbar progresivo</b>. TC y centellograma: <b>lesiones líticas lumbares y lesión hepática de 1.8 cm</b>. Biopsia: <b>metastásico, RE+, HER2-</b>, sin crisis visceral.</p>
        <div class="callout warn">Progresión metastásica tras terapia endocrina adyuvante. Definir primera línea.</div>`, buttonLabel:"Definir primera línea metastásica →"},
      {type:"decision", phase:4, eyebrow:"Decisión 4 · Primera línea metastásica", vitalsUpdate:{"Estadio":"Metastásico (óseo + hepático)"},
        prompt:"RE+/HER2- metastásico, sin crisis visceral, posmenopáusica. ¿Esquema de primera línea preferido?",
        options:[
          {label:"Inhibidor de aromatasa + inhibidor de CDK4/6 (ribociclib)", points:2,

    stages:[
      {type:"info", phase:0, eyebrow:"Consulta inicial", html:`
        <p>C.A., 76 años, con insuficiencia cardíaca compensada y deterioro cognitivo leve, vive con su hija. Nódulo palpable de 1.8 cm en mama derecha, hallado en control de rutina.</p>

        <div class="callout">Luminal A de bajo grado en una paciente frágil con comorbilidades relevantes. La fragilidad y las comorbilidades, no solo la biología tumoral, deben pesar en la secuencia de tratamiento.</div>`, buttonLabel:"Continuar a la primera decisión →"},
      {type:"decision", phase:1, eyebrow:"Decisión 1 · Abordaje inicial",
        prompt:"Paciente frágil con comorbilidad cardíaca, cirugía programable pero no urgente, tumor pequeño RE muy positivo. ¿Cuál es la conducta inicial más razonable?",
        options:[

            feedback:"Correcto en este contexto específico. A diferencia de una paciente sin comorbilidades relevantes, aquí la terapia endocrina neoadyuvante permite iniciar tratamiento oncológico sin demora mientras se optimiza el riesgo cardíaco y cognitivo para la cirugía, sin perder control de la enfermedad dado el perfil de muy baja agresividad.",
            paper:"ACOSOG Z1031 — Ellis et al., J Clin Oncol 2011; guías de manejo geriátrico oncológico (SIOG)", finding:"La terapia endocrina neoadyuvante es una estrategia validada en RE+ posmenopáusicas para diferir la cirugía sin comprometer el control oncológico, especialmente útil cuando hay que optimizar comorbilidades antes de una cirugía electiva."},
          {label:"Cirugía inmediata, igual que en una paciente sin comorbilidades", points:1,
            feedback:"No es incorrecto de por sí, pero ignora la oportunidad de optimizar antes el riesgo cardíaco y cognitivo sin perder control oncológico, dado lo indolente del tumor.",
            paper:"Guías SIOG (International Society of Geriatric Oncology)", finding:"Recomiendan individualizar la secuencia de tratamiento en pacientes mayores frágiles, considerando diferir intervenciones no urgentes cuando el perfil tumoral lo permite."},
          {label:"Quimioterapia neoadyuvante estándar", points:0,
            feedback:"Doblemente inapropiado: la baja proliferación no predice respuesta relevante, y la toxicidad de la quimioterapia en una paciente frágil con comorbilidad cardíaca es especialmente riesgosa.",
            paper:"Rouzier et al., Clin Cancer Res 2005", finding:"Los tumores luminales de baja proliferación tienen tasas mínimas de respuesta patológica completa a quimioterapia."},
          {label:"No ofrecer ningún tratamiento oncológico dada la edad y comorbilidad", points:0,
            feedback:"La edad y la comorbilidad no son por sí solas motivo para negar tratamiento; existen estrategias de baja toxicidad (terapia endocrina) perfectamente aplicables en esta paciente.",
            paper:"Guías SIOG (International Society of Geriatric Oncology)", finding:"Desaconsejan negar tratamiento oncológico basándose únicamente en la edad cronológica, recomendando evaluación geriátrica integral para individualizar la conducta."}
        ]},
      {type:"info", phase:2, eyebrow:"Resultado tras 5 meses de terapia endocrina neoadyuvante", vitalsUpdate:{"Tratamiento":"Cirugía realizada tras neoadyuvancia endocrina","Estadio":"ypT1aN0"}, html:`
        <p>Tras optimización cardiológica y 5 meses de letrozol neoadyuvante, el tumor se redujo a 0.9 cm. Se realiza <b>tumorectomía + ganglio centinela</b> bajo anestesia local con sedación. Patología: <b>ypT1aN0, márgenes negativos</b>.</p>
        <div class="callout good">Dado el perfil de bajísimo riesgo (tumor <1cm, grado 1, N0, Ki67 5%), no se solicita test genómico: el riesgo basal ya es suficientemente bajo como para no cambiar la conducta de adyuvancia.</div>`, buttonLabel:"Definir adyuvancia →"},
      {type:"decision", phase:2, eyebrow:"Decisión 2 · Adyuvancia y duración inicial",
        prompt:"Paciente de 76 años, ypT1aN0, grado 1, Ki67 5%, con comorbilidad cardíaca y deterioro cognitivo leve que vive acompañada. ¿Qué adyuvancia corresponde?",
        options:[
          {label:"Continuar el mismo inhibidor de aromatasa como terapia endocrina adyuvante, sin quimioterapia ni CDK4/6i", points:2,
            feedback:"Correcto. El riesgo basal es mínimo (tumor pequeño, grado 1, N0, Ki67 bajo), por lo que ni la quimioterapia ni un inhibidor de CDK4/6 aportan beneficio esperado; se continúa la terapia endocrina que ya venía tolerando bien.",
            paper:"EBCTCG meta-analysis, Lancet 2011", finding:"La terapia endocrina adyuvante sola es suficiente en tumores RE+ de bajo riesgo, sin necesidad de intensificación adicional."},
          {label:"Agregar quimioterapia adyuvante dado que ya tiene 76 años y hay que ser agresivo", points:0,

          {label:"Agregar un inhibidor de CDK4/6 adyuvante por seguridad adicional", points:0,
            feedback:"No cumple criterios de alto riesgo (N0, grado 1, Ki67 bajo); agregarlo solo añade toxicidad sin beneficio esperado.",
            paper:"monarchE — Johnston et al., J Clin Oncol 2020", finding:"El beneficio se limita a la población de alto riesgo definida por el estudio, no a tumores de bajo riesgo como este."},
          {label:"Suspender toda terapia endocrina dado que ya se operó", points:0,
            feedback:"La terapia endocrina adyuvante continúa siendo necesaria tras la cirugía en un tumor RE+, independientemente de haberla recibido en forma neoadyuvante.",
            paper:"EBCTCG meta-analysis, Lancet 2011", finding:"La terapia endocrina adyuvante prolongada reduce el riesgo de recurrencia incluso en tumores de bajo riesgo."}
        ]},
      {type:"info", phase:3, eyebrow:"Evento de toxicidad · 4 meses de inhibidor de aromatasa adyuvante", vitalsUpdate:{"Tratamiento":"Letrozol — evento de toxicidad musculoesquelética"}, html:`
        <p>La hija de la paciente consulta porque C.A. presenta <b>dolor articular generalizado en manos, rodillas y hombros</b>, con dificultad creciente para levantarse de la silla y un episodio de <b>caída sin lesión grave</b>. Refiere que "no quiere seguir tomando la pastilla".</p>
        <div class="callout warn">Las artralgias asociadas a inhibidores de aromatasa son muy frecuentes y una causa común de abandono del tratamiento; en una paciente frágil con riesgo de caídas, el impacto funcional es especialmente relevante.</div>`, buttonLabel:"Decidir conducta ante la toxicidad →"},
      {type:"decision", phase:3, eyebrow:"Decisión de toxicidad · Artralgia por inhibidor de aromatasa con riesgo de caídas",
        prompt:"Artralgia significativa con impacto funcional y una caída, bajo letrozol adyuvante, en paciente frágil que expresa deseo de discontinuar. ¿Cuál es la conducta más apropiada?",
        options:[
          {label:"Suspender temporalmente el inhibidor de aromatasa, indicar analgesia y actividad física adaptada, y al reiniciar considerar rotar a otro inhibidor de aromatasa o cambiar a tamoxifeno si persiste el síntoma", points:2,
            feedback:"Correcto. La artralgia por inhibidores de aromatasa suele responder a pausas breves, analgesia y ejercicio; si persiste o compromete la seguridad (como el riesgo de caídas aquí), rotar a otro inhibidor de aromatasa o cambiar a tamoxifeno es una estrategia validada antes de abandonar la terapia endocrina por completo.",
            paper:"Niravath, Ann Oncol 2013 (revisión de artralgia por inhibidores de aromatasa)", finding:"Documenta que la artralgia asociada a inhibidores de aromatasa afecta hasta a un tercio de las pacientes y es causa frecuente de abandono; recomienda manejo escalonado con pausa, analgesia, ejercicio, y rotación de agente o cambio a tamoxifeno si no mejora."},
          {label:"Continuar el mismo esquema sin cambios, insistiendo en la importancia del tratamiento", points:0,
            feedback:"Ignorar el impacto funcional y el riesgo de caídas en una paciente frágil puede llevar a una lesión grave (por ejemplo, fractura de cadera) y, paradójicamente, a que la paciente abandone el tratamiento por su cuenta sin supervisión médica.",
            paper:"Niravath, Ann Oncol 2013", finding:"El manejo no dirigido de la artralgia es la principal causa de discontinuación no supervisada de la terapia endocrina."},
          {label:"Suspender la terapia endocrina de forma definitiva sin intentar rotar de agente", points:1,
            feedback:"Puede terminar siendo necesario si ninguna alternativa es tolerada, pero como primera conducta se prefiere intentar pausa, analgesia y rotación de agente antes de discontinuar definitivamente un tratamiento con beneficio demostrado.",
            paper:"Niravath, Ann Oncol 2013", finding:"El manejo escalonado antes de la discontinución definitiva mejora la adherencia sin perder el beneficio oncológico en la mayoría de los casos."},
          {label:"Aumentar la dosis de letrozol para compensar una eventual pérdida de eficacia por el dolor", points:0,
            feedback:"No tiene sentido farmacológico: la dosis de letrozol no se ajusta por síntomas articulares, y aumentarla solo empeoraría la tolerancia sin beneficio oncológico adicional.",
            paper:"—", finding:"La dosis estándar de inhibidores de aromatasa ya produce supresión estrogénica máxima; no existe relación dosis-respuesta que justifique aumentarla."}
        ]},
      {type:"decision", phase:4, eyebrow:"Decisión 3 · Duración de la terapia endocrina",
        prompt:"Tras rotar a un inhibidor de aromatasa mejor tolerado, la paciente completa 5 años de terapia endocrina sin evidencia de enfermedad, ahora con 81 años, con deterioro cognitivo leve-moderado y buena funcionalidad general. ¿Qué conducta corresponde respecto a extender el tratamiento a 10 años?",

            paper:"EBCTCG meta-analysis extended endocrine therapy, Lancet Oncol 2020", finding:"El beneficio de extender la terapia endocrina más allá de 5 años es proporcional al riesgo basal de recurrencia; en tumores de bajo riesgo, el beneficio absoluto adicional es pequeño y debe balancearse contra la toxicidad acumulada."},
          {label:"Extender automáticamente a 10 años porque es lo recomendado en todas las pacientes RE+", points:0,

      {type:"info", phase:0, eyebrow:"Consulta inicial", html:`

      {type:"decision", phase:1, eyebrow:"Decisión 1 · Abordaje inicial",

          {label:"Terapia endocrina neoadyuvante dado que es RE positivo", points:0,

      {type:"info", phase:1, eyebrow:"Resultado quirúrgico", vitalsUpdate:{"Tratamiento":"Cirugía realizada"}, html:`
        <p><b>Tumorectomía + ganglio centinela</b>: carcinoma ductal infiltrante 2.9 cm, márgenes negativos, <b>0/3 ganglios positivos (pN0)</b>. Oncotype DX sobre la pieza: <b>Recurrence Score 22</b> (intermedio).</p>`, buttonLabel:"Definir adyuvancia sistémica →"},
      {type:"decision", phase:2, eyebrow:"Decisión 2 · Adyuvancia sistémica",

            feedback:"Correcto. A diferencia de una paciente mayor de 50 años con el mismo RS, en el subgrupo de 50 años o menos con RS 16-25, TAILORx sí mostró un beneficio modesto pero real de agregar quimioterapia, por lo que aquí sí corresponde intensificar el tratamiento. AC-T (doxorrubicina + ciclofosfamida seguido de un taxano) es el esquema con antraciclina más utilizado en este contexto; en pacientes N0 de riesgo moderado, un esquema no antraciclínico como TC (docetaxel + ciclofosfamida x4) es una alternativa razonable con menor cardiotoxicidad.",

          {label:"Terapia endocrina + inhibidor de CDK4/6, sin quimioterapia", points:0,

      {type:"info", phase:3, eyebrow:"Evento de toxicidad · ciclo 2 de quimioterapia adyuvante", vitalsUpdate:{"Tratamiento":"AC-T adyuvante — evento de toxicidad"}, html:`

        <div class="callout warn">Fiebre en el contexto de neutropenia grado 4 post-quimioterapia es una urgencia oncológica que requiere manejo hospitalario inmediato, independientemente del buen estado general aparente.</div>`, buttonLabel:"Decidir conducta ante la toxicidad →"},

            feedback:"Correcto. La neutropenia febril es una urgencia oncológica: requiere hospitalización, cultivos y antibióticos empíricos de amplio espectro iniciados dentro de la primera hora, sin esperar el resultado de los cultivos. En los ciclos posteriores se agrega profilaxis con factor estimulante de colonias de granulocitos.",

            paper:"NCCN Guidelines — Management of Fever and Neutropenia", finding:"El manejo ambulatorio solo se considera en pacientes de bajo riesgo (según escalas validadas como MASCC), lo que generalmente excluye neutropenia grado 4."},

      {type:"decision", phase:4, eyebrow:"Decisión 3 · Terapia endocrina adyuvante y estado menopáusico",

      {type:"info", phase:5, eyebrow:"Seguimiento — recurrencia a los 4 años", vitalsUpdate:{"Tratamiento":"OFS + IA adyuvante completado","Estadio":"Metastásico (óseo)"}, html:`

      {type:"decision", phase:5, eyebrow:"Decisión 4 · Primera línea metastásica",

        <p>A los 20 meses, nuevas lesiones óseas y aparición de una lesión hepática pequeña. ctDNA: <b>AKT1</b> mutación E17K detectada; <b>ESR1</b> y <b>PIK3CA</b> sin alteraciones.</p>

      {type:"decision", phase:6, eyebrow:"Decisión 5 · Segunda línea metastásica",

      {type:"info", phase:2, eyebrow:"Resultado tras neoadyuvancia y cirugía", vitalsUpdate:{"Tratamiento":"NACT + cirugía realizada","Estadio":"ypT0N0 (respuesta patológica completa)"}, html:`
        <p>Completa 6 ciclos de quimioterapia neoadyuvante con excelente respuesta clínica. <b>Tumorectomía + disección axilar</b>. Patología: <b>sin tumor invasivo residual en la mama ni en los ganglios (ypT0N0) — respuesta patológica completa</b>.</p>

      {type:"info", phase:3, eyebrow:"Evento de toxicidad · 2 meses de terapia endocrina adyuvante", vitalsUpdate:{"Tratamiento":"Tamoxifeno — evaluación de función ovárica pendiente"}, html:`
        <p>Al iniciar terapia endocrina, persiste la duda sobre su estado menopáusico (última menstruación hace 5 meses antes de iniciar quimioterapia, que puede inducir amenorrea adicional). Se inició tamoxifeno de forma provisional mientras se aclaraba el estado hormonal. A los 2 meses, refiere <b>sofocos intensos, alteraciones del sueño y dolor articular generalizado</b> que están afectando su desempeño laboral, y pregunta si puede abandonar el tratamiento.</p>
        <div class="callout warn">Los síntomas vasomotores y articulares son la causa más frecuente de mala adherencia a la terapia endocrina; requieren manejo activo, no solo indicar que "hay que aguantar".</div>`, buttonLabel:"Decidir conducta →"},
      {type:"decision", phase:3, eyebrow:"Decisión de toxicidad · Síntomas vasomotores y adherencia a terapia endocrina",

            paper:"Guías de manejo de menopausia inducida por quimioterapia; consenso de manejo de síntomas de terapia endocrina (NCCN Survivorship)", finding:"Recomiendan confirmar el estado hormonal antes de definir el esquema endocrino definitivo en mujeres perimenopáusicas que reciben quimioterapia, y abordar activamente los síntomas vasomotores y articulares como estrategia central para sostener la adherencia, dado que el abandono no supervisado es frecuente y anula el beneficio del tratamiento."},

          {label:"Suspender la terapia endocrina de inmediato ante la solicitud de la paciente", points:0,

            paper:"NCCN Survivorship Guidelines", finding:"Recomienda intentar manejo sintomático activo y ajuste de esquema antes de la discontinuación completa de la terapia endocrina."},
          {label:"Cambiar directamente a quimioterapia de mantenimiento en lugar de terapia endocrina", points:0,

        ]},
      {type:"info", phase:4, eyebrow:"Recaída — 4 años después", vitalsUpdate:{"Tratamiento":"Recaída tras adyuvancia completa (endocrino-sensible)","Estadio":"Metastásico (óseo + hepático)"}, html:`
        <p>Completó los 2 años de abemaciclib adyuvante y continuó con inhibidor de aromatasa. Cuatro años después de finalizado el abemaciclib, en un control de rutina se detectan <b>lesiones óseas múltiples y una lesión hepática de 2 cm</b>. Biopsia hepática: <b>metastásico, RE+/RP+, HER2 negativo</b>.</p>

      {type:"decision", phase:4, eyebrow:"Decisión 3 · Primera línea metastásica",
        prompt:"Recaída ósea y hepática 4 años después de completar abemaciclib + terapia endocrina adyuvante, RE+/HER2- metastásico, sin crisis visceral. ¿Esquema de primera línea preferido?",

            paper:"MONALEESA-2 — Hortobagyi et al., N Engl J Med 2016; consenso ESMO sobre recaída endocrino-sensible", finding:"Las pacientes con recaída más de 12 meses después de completar terapia endocrina (con o sin CDK4/6i) adyuvante se consideran endocrino-sensibles y son candidatas al esquema estándar de primera línea metastásica, incluyendo un inhibidor de CDK4/6i aunque ya hayan recibido uno en el escenario adyuvante."},

      {type:"info", phase:1, eyebrow:"Resultado tras neoadyuvancia y cirugía", vitalsUpdate:{"Tratamiento":"NACT + cirugía realizada — respuesta mínima","Estadio":"ypT3N2 (enfermedad residual extensa)"}, html:`
        <p>Completa la quimioterapia neoadyuvante con <b>respuesta clínica mínima</b>. Se realiza <b>mastectomía + disección axilar</b>. Patología: <b>enfermedad residual extensa de 4.5 cm, 6/18 ganglios positivos (ypT3N2)</b>.</p>

          {label:"Solicitar una biopsia hepática de inmediato antes de decidir cualquier conducta", points:0,

            paper:"perfil de seguridad de ribociclib", finding:"El manejo estándar de la hepatotoxicidad por CDK4/6i es no invasivo en la mayoría de los casos, basado en interrupción y seguimiento bioquímico."}

      {type:"info", phase:4, eyebrow:"Recaída — 8 meses tras finalizar la adyuvancia", vitalsUpdate:{"Tratamiento":"Recaída temprana con crisis visceral","Estadio":"Metastásico hepático extenso — crisis visceral"}, html:`
        <p>Tras completar la adyuvancia (con ribociclib a dosis reducida, sin nueva toxicidad relevante), a los 8 meses de finalizado el tratamiento la paciente consulta por <b>ictericia progresiva y dolor en hipocondrio derecho</b>. TC: <b>reemplazo hepático extenso por metástasis</b>, con <b>bilirrubina 4.2 mg/dL y transaminasas marcadamente elevadas</b>, deterioro clínico rápido.</p>
        <div class="callout warn">Recaída temprana (menos de 12 meses de finalizada la adyuvancia) con compromiso hepático extenso y disfunción hepática: esto constituye una <b>crisis visceral</b>, una situación clínica distinta a la de un compromiso metastásico estable, que cambia la estrategia de primera línea.</div>`, buttonLabel:"Definir conducta ante la crisis visceral →"},
      {type:"decision", phase:5, eyebrow:"Decisión 4 · Primera línea metastásica en crisis visceral",
        prompt:"Recaída temprana (menos de 12 meses de la adyuvancia) con compromiso hepático extenso, disfunción hepática y deterioro clínico rápido: crisis visceral. ¿Cuál es la conducta más apropiada de primera línea?",
        options:[
          {label:"Quimioterapia citotóxica (por ejemplo, un taxano), priorizando una respuesta rápida antes que terapia endocrina-based", points:2,
            feedback:"Correcto. La crisis visceral —definida por disfunción orgánica grave que amenaza la vida o requiere una respuesta rápida y de alta probabilidad, como en este caso de insuficiencia hepática por reemplazo tumoral extenso— es la indicación clásica para iniciar quimioterapia citotóxica en primera línea, incluso en enfermedad RE positiva, priorizando la velocidad y probabilidad de respuesta sobre la terapia endocrina-based.",
            paper:"NCCN Guidelines Breast Cancer, versión vigente; ESMO Metastatic Breast Cancer Guidelines", finding:"Definen la crisis visceral como una indicación específica para preferir quimioterapia citotóxica sobre terapia endocrina-based en primera línea, incluso en tumores RE positivos, debido a la necesidad de una respuesta más rápida y con mayor probabilidad de control inmediato de la enfermedad."},
          {label:"Inhibidor de aromatasa + inhibidor de CDK4/6, igual que en un caso sin crisis visceral", points:0,

            paper:"NCCN Guidelines Breast Cancer", finding:"Reserva la terapia endocrina-based de primera línea para pacientes sin crisis visceral."},
          {label:"Fulvestrant en monoterapia, dado que es menos tóxico que la quimioterapia", points:0,
            feedback:"Menor toxicidad no compensa la necesidad de una respuesta rápida y de alta probabilidad que requiere esta situación clínica de riesgo vital inminente.",
            paper:"NCCN Guidelines Breast Cancer", finding:"La crisis visceral requiere priorizar la probabilidad y velocidad de respuesta por sobre el perfil de toxicidad más favorable de la terapia endocrina."},
          {label:"Manejo exclusivamente paliativo sin tratamiento oncológico activo, dado el mal pronóstico aparente", points:0,
            feedback:"Es prematuro: una crisis visceral es una urgencia oncológica tratable en muchos casos con quimioterapia de inicio rápido, que puede revertir el deterioro clínico; los cuidados paliativos se integran en paralelo, no reemplazan el intento de tratamiento activo de entrada.",
            paper:"NCCN Guidelines Breast Cancer", finding:"Recomienda tratamiento sistémico activo urgente ante crisis visceral potencialmente reversible, integrando cuidados de soporte en paralelo."}
        ]},
      {type:"info", phase:6, eyebrow:"Respuesta a la quimioterapia — 4 meses después", vitalsUpdate:{"Tratamiento":"Respuesta a quimioterapia — crisis visceral resuelta","Estadio":"Metastásico hepático — enfermedad estable, crisis resuelta"}, html:`
        <p>Tras 4 meses de quimioterapia con taxano, la bilirrubina se normalizó, la función hepática mejoró marcadamente y la TC muestra <b>reducción significativa de la carga tumoral hepática</b>. La paciente está clínicamente estable, sin signos de disfunción orgánica.</p>
        <div class="callout good">Con la crisis visceral resuelta y el tumor RE positivo, se abre la pregunta de si conviene continuar la quimioterapia indefinidamente o cambiar de estrategia una vez lograda la estabilización.</div>`, buttonLabel:"Definir conducta de mantenimiento →"},
      {type:"decision", phase:6, eyebrow:"Decisión 5 · Mantenimiento tras respuesta a la quimioterapia de inducción",
        prompt:"Crisis visceral resuelta tras quimioterapia de inducción, tumor RE positivo/HER2 negativo, buena respuesta clínica y radiológica. ¿Cuál es la conducta más apropiada de mantenimiento?",
        options:[
          {label:"Suspender la quimioterapia y pasar a terapia endocrina + inhibidor de CDK4/6 de mantenimiento", points:2,
            feedback:"Correcto. Una vez resuelta la crisis visceral y lograda la estabilización con quimioterapia de inducción, el estándar es cambiar a una estrategia de mantenimiento con terapia endocrina-based (inhibidor de aromatasa + CDK4/6i) en tumores RE positivos, reservando la quimioterapia continua para cuando ya no hay alternativa endocrina razonable.",
            paper:"NCCN Guidelines Breast Cancer; ESMO Metastatic Breast Cancer Guidelines", finding:"Recomiendan que, tras controlar una crisis visceral con quimioterapia y lograr respuesta o estabilización, se reevalúe el cambio a terapia endocrina-based de mantenimiento en tumores RE positivos, dado su menor toxicidad acumulada y beneficio sostenido a largo plazo."},
          {label:"Continuar la misma quimioterapia en forma indefinida mientras haya respuesta", points:0,
            feedback:"La quimioterapia prolongada acumula toxicidad (neuropatía, mielosupresión, fatiga) sin beneficio adicional claro una vez que existe una alternativa de menor toxicidad y eficacia sostenida como la terapia endocrina-based en un tumor RE positivo.",
            paper:"NCCN Guidelines Breast Cancer", finding:"No recomienda quimioterapia continua indefinida en tumores RE positivos que han respondido, cuando existe una opción de mantenimiento endocrino disponible."},
          {label:"Suspender todo tratamiento oncológico activo dado que la crisis se resolvió", points:0,
            feedback:"Sería un error: la enfermedad metastásica sigue presente y requiere tratamiento de mantenimiento continuo para sostener el control alcanzado; suspender todo tratamiento lleva a una recaída rápida.",
            paper:"NCCN Guidelines Breast Cancer", finding:"Recomienda mantenimiento continuo tras la respuesta a la primera línea en enfermedad metastásica, no la suspensión completa del tratamiento."},
          {label:"Cambiar a un segundo esquema de quimioterapia distinto como mantenimiento", points:1,

            paper:"NCCN Guidelines Breast Cancer", finding:"En tumores RE positivos, la terapia endocrina-based es preferida como mantenimiento sobre la quimioterapia de mantenimiento con otro agente citotóxico."}
        ]}
    ]}

  ]

      {type:"info", phase:3, eyebrow:"Evento de toxicidad · segunda infusión de pertuzumab adyuvante", vitalsUpdate:{"Tratamiento":"THP adyuvante — evento de toxicidad aguda"}, html:`

          {label:"Terapia endocrina sola (inhibidor de aromatasa), dado que el tumor también es RE positivo", points:0,

            paper:"CLEOPATRA — Swain et al., N Engl J Med 2015", finding:"La enfermedad metastásica HER2 positiva requiere reiniciar bloqueo anti-HER2 activo, independientemente del tratamiento endocrino adyuvante previo."}

        <p>Durante el ciclo 3, presenta <b>diarrea grado 3 (7 episodios/día)</b> asociada al esquema con docetaxel y pertuzumab, con signos de deshidratación leve-moderada.</p>

      {type:"decision", phase:2, eyebrow:"Decisión de toxicidad · Hepatotoxicidad grado 3 por alectinib",

      {type:"decision", phase:4, eyebrow:"Decisión 2 · Tratamiento tras progresión cerebral bajo alectinib",

      {type:"info", phase:5, eyebrow:"Progresión sistémica — 11 meses de lorlatinib", vitalsUpdate:{"Tratamiento":"Progresión extracraneal bajo lorlatinib"}, html:`

nodriver: {

        <p>H.G., 66 años, fumador activo (40 paquetes-año), consulta por dolor torácico y pérdida de peso de 2 meses. TC de tórax: <b>masa de 5 cm en el lóbulo superior derecho con múltiples nódulos pulmonares contralaterales y una lesión suprarrenal</b>.</p>
        <p>Biopsia: <b>adenocarcinoma de pulmón</b>. Panel molecular: <b>EGFR, ALK, ROS1, BRAF, MET, RET y NTRK negativos</b> (sin alteración conductora accionable). <b>PD-L1 (TPS) 60%</b>. Estadio <b>IV metastásico de novo</b>. ECOG 1.</p>

      {type:"decision", phase:1, eyebrow:"Decisión 1 · Primera línea sistémica",
        prompt:"NSCLC metastásico sin alteración conductora, PD-L1 TPS 60%, ECOG 1, sin enfermedad de progresión rápida que amenace la vida. ¿Cuál es la conducta de primera línea más apropiada?",

            paper:"KEYNOTE-024 — Reck et al., N Engl J Med 2016; actualización a 5 años, Reck et al., 2021", finding:"En pacientes con PD-L1 TPS ≥50% sin alteración conductora, pembrolizumab en monoterapia mejoró significativamente la supervivencia libre de progresión y la supervivencia global frente a quimioterapia con platino, con una tasa de supervivencia a 5 años sustancialmente mayor que la esperada históricamente con quimioterapia sola."},
          {label:"Pembrolizumab + quimioterapia con platino", points:1,

            paper:"KEYNOTE-189 — Gandhi et al., N Engl J Med 2018", finding:"Mostró beneficio de agregar pembrolizumab a quimioterapia en la población general no seleccionada por PD-L1 alto; en el subgrupo específico de TPS ≥50%, los resultados de monoterapia con pembrolizumab (KEYNOTE-024) son comparables con menor toxicidad acumulada."},
          {label:"Quimioterapia con platino sola, sin inmunoterapia", points:0,

            paper:"KEYNOTE-024 — Reck et al., N Engl J Med 2016", finding:"Pembrolizumab en monoterapia fue claramente superior a la quimioterapia con platino sola en el subgrupo de PD-L1 TPS ≥50%."},
          {label:"Terapia dirigida empírica contra EGFR, dado que es un adenocarcinoma", points:0,

      {type:"decision", phase:2, eyebrow:"Decisión de toxicidad · Neumonitis inmunomediada por pembrolizumab",

            paper:"ASCO Guideline — Schneider et al., J Clin Oncol 2021 (manejo de eventos adversos inmunomediados)", finding:"Recomienda suspender el inhibidor de checkpoint ante neumonitis grado ≥2 e iniciar corticoides sistémicos, escalando la dosis y considerando hospitalización según la severidad de la hipoxemia y el compromiso respiratorio."},
          {label:"Continuar pembrolizumab, dado que la enfermedad tumoral está respondiendo bien", points:0,

      ${isLogin ? `<div class="auth-toggle"><span id="authForgot">¿Olvidaste tu contraseña?</span></div>` : ""}
      <div class="auth-toggle">
        ${isLogin ? "¿No tenés cuenta? " : "¿Ya tenés cuenta? "}<span id="authToggle">${isLogin ? "Creá una" : "Iniciá sesión"}</span>
      </div>
    </div>
  `;
  document.getElementById("authToggle").onclick = () => { authMode = isLogin ? "signup" : "login"; renderAuth(); };
  document.getElementById("authSubmit").onclick = submitAuth;
  document.getElementById("authPassword").addEventListener("keydown", e => { if(e.key === "Enter") submitAuth(); });
  if(isLogin) document.getElementById("authForgot").onclick = () => { authMode = "reset"; renderAuth(); };
}

function showAuthError(msg){
  const wrap = document.getElementById("authErrorWrap");
  if(wrap) wrap.innerHTML = `<div class="auth-error">${msg}</div>`;
}

function submitAuth(){
  const email = document.getElementById("authEmail").value.trim();
  const btn = document.getElementById("authSubmit");

  if(authMode === "reset"){
    if(!email){ showAuthError("Ingresá tu email."); return; }
    btn.disabled = true;
    auth.sendPasswordResetEmail(email).then(() => {
      const wrap = document.getElementById("authErrorWrap");
      if(wrap) wrap.innerHTML = `<div class="auth-success">Listo — si ese email está registrado, te va a llegar un link para elegir una contraseña nueva. Revisá también la carpeta de spam.</div>`;
      btn.textContent = "Link enviado";
    }).catch(err => {
      showAuthError(AUTH_ERRORS[err.code] || "Ocurrió un error. Intentá de nuevo.");
      btn.disabled = false;
    });
    return;
  }

  const password = document.getElementById("authPassword").value;
  if(!email || !password){ showAuthError("Completá email y contraseña."); return; }
  btn.disabled = true;
  const action = authMode === "login"
    ? auth.signInWithEmailAndPassword(email, password)
    : auth.createUserWithEmailAndPassword(email, password);
  action.catch(err => {
    showAuthError(AUTH_ERRORS[err.code] || "Ocurrió un error. Intentá de nuevo.");
    btn.disabled = false;
  });
}

function renderUserBar(){
  const bar = document.getElementById("userBar");
  if(!bar) return;
  if(!currentUser){ bar.innerHTML = ""; return; }
  bar.innerHTML = `
    <span class="email">${currentUser.email}</span>
    <button id="historyBtn">Mi historial</button>
    <button id="logoutBtn">Cerrar sesión</button>
  `;
  document.getElementById("historyBtn").onclick = renderHistory;
  document.getElementById("logoutBtn").onclick = () => auth.signOut();
}

function saveResult(){
  if(!currentUser) return;
  const c = getActiveCase();
  db.collection("users").doc(currentUser.uid).collection("results").add({
    cancer: CANCER[activeCancer].label,
    module: CANCER[activeCancer].modules[activeModule].title,
    caseLabel: c.label,
    score: state.score,
    maxScore: state.maxScore,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(() => {});
}

function renderHistory(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="crumb"><span id="crumbHome">Inicio</span> / Mi historial</div>
    <p class="intro">Tus resultados guardados de casos completados.</p>
    <div id="historyList"><p class="history-empty">Cargando…</p></div>
  `;
  document.getElementById("crumbHome").onclick = goHome;
  db.collection("users").doc(currentUser.uid).collection("results")
    .orderBy("timestamp", "desc").limit(100).get()
    .then(snap => {
      const list = document.getElementById("historyList");
      if(snap.empty){ list.innerHTML = `<p class="history-empty">Todavía no completaste ningún caso.</p>`; return; }
      list.innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        const date = d.timestamp ? d.timestamp.toDate().toLocaleDateString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "—";
        return `
          <div class="history-item">
            <div class="hi-main">
              <div><b>${d.caseLabel}</b> — ${d.module}</div>
              <div class="hi-date">${d.cancer} · ${date}</div>
            </div>
            <div class="hi-score">${d.score} / ${d.maxScore}</div>
          </div>
        `;
      }).join("");
    })
    .catch(() => {
      document.getElementById("historyList").innerHTML = `<p class="history-empty">No se pudo cargar el historial.</p>`;
    });
}

auth.onAuthStateChanged(user => {
  currentUser = user;
  renderUserBar();
  if(user) renderHome();
  else { authMode = "login"; renderAuth(); }
});

/* ===================== ENGINE ===================== */

let activeCancer = null;
let activeModule = null;
let activeCaseKey = null;
let stages = null;
let state = { step:0, score:0, maxScore:0, answered:false, vitals:{} };
let currentOptions = null;

const THEORY_PDFS = new Set(["lumA","lumB","her2","tnbc","egfr","alk","nodriver","sclc"]);

function renderHome(){
  activeCancer = null; activeModule = null; activeCaseKey = null;
  const app = document.getElementById("app");
  app.innerHTML = `
    <p class="intro">Elegí qué tipo de cáncer querés simular. Cada sección tiene sus propios módulos por subtipo molecular, y cada módulo tiene varios casos distintos para practicar.</p>
    <div class="sectiongrid" id="sectiongrid"></div>
  `;
  const grid = document.getElementById("sectiongrid");
  Object.entries(CANCER).forEach(([key, c]) => {
    const card = document.createElement("button");
    card.className = "sectioncard" + (key === "pulmon" ? " pulmon" : "");
    card.innerHTML = `<span class="icon">${c.icon}</span><h2>${c.label}</h2><p>${c.desc}</p>`;
    card.onclick = () => renderModuleSelect(key);
    grid.appendChild(card);
  });
}

function renderModuleSelect(cancerKey){
  activeCancer = cancerKey; activeModule = null; activeCaseKey = null;
  const cancer = CANCER[cancerKey];
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="crumb"><span id="crumbHome">Inicio</span> / ${cancer.label}</div>
    <p class="intro">${cancer.desc}</p>
    <div class="modgrid" id="modgrid"></div>
  `;
  document.getElementById("crumbHome").onclick = renderHome;
  const grid = document.getElementById("modgrid");
  Object.entries(cancer.modules).forEach(([key, m]) => {
    const card = document.createElement("button");
    card.className = "modcard";
    card.innerHTML = `<span class="tag ${m.tag}">${m.tagLabel}</span><h3>${m.title}</h3><p>${m.moduleDesc}</p>`;
    card.onclick = () => renderCaseSelect(cancerKey, key);
    grid.appendChild(card);
  });
}

function renderCaseSelect(cancerKey, moduleKey){
  activeCancer = cancerKey; activeModule = moduleKey; activeCaseKey = null;
  const cancer = CANCER[cancerKey];
  const m = cancer.modules[moduleKey];
  const app = document.getElementById("app");
  const theoryHtml = THEORY_PDFS.has(moduleKey) ? `
    <a class="theory-link" href="teoria/${moduleKey}.pdf" target="_blank" rel="noopener">
      <span class="theory-icon">📄</span>
      <span>
        <b>Marco teórico — ${m.title}</b>
        <small>Descargá el resumen antes de resolver los casos</small>
      </span>
    </a>` : "";
  app.innerHTML = `
    <div class="crumb"><span id="crumbHome">Inicio</span> / <span id="crumbCancer">${cancer.label}</span> / ${m.title}</div>
    <p class="intro">${m.moduleDesc} Elegí uno de los casos para empezar la consulta.</p>
    ${theoryHtml}
    <div class="casegrid" id="casegrid"></div>
  `;
  document.getElementById("crumbHome").onclick = renderHome;
  document.getElementById("crumbCancer").onclick = () => renderModuleSelect(cancerKey);
  const grid = document.getElementById("casegrid");
  m.cases.forEach((c, i) => {
    const card = document.createElement("button");
    card.className = "modcard casecard";
    card.innerHTML = `<span class="casenum">${String(i+1).padStart(2,"0")}</span><div><h3>${c.label}</h3><p>${c.cardDesc}</p></div>`;
    card.onclick = () => startCase(cancerKey, moduleKey, c.key);
    grid.appendChild(card);
  });
}

function startCase(cancerKey, moduleKey, caseKey){
  activeCancer = cancerKey; activeModule = moduleKey; activeCaseKey = caseKey;
  const c = CANCER[cancerKey].modules[moduleKey].cases.find(x => x.key === caseKey);
  stages = c.stages;
  state = { step:0, score:0, maxScore:0, answered:false, vitals: Object.assign({}, c.vitals) };
  renderGame();
}

function getActiveCase(){
  return CANCER[activeCancer].modules[activeModule].cases.find(x => x.key === activeCaseKey);
}

function renderVitals(){
  const el = document.getElementById("vitals");
  if(!el) return;
  el.innerHTML = Object.entries(state.vitals).map(([k,v]) =>
    `<div><span class="k">${k}</span><span class="v">${v}</span></div>`
  ).join("");
}

function renderTimeline(activeIndex){
  const el = document.getElementById("timeline");
  if(!el) return;
  const labels = getActiveCase().timeline;
  el.innerHTML = labels.map((label,i) => {
    const isToxLabel = label.toLowerCase().includes("toxicidad");
    return `<div class="tl-item ${i < activeIndex ? "done":""} ${isToxLabel ? "tox":""}"><div class="tl-dot"></div><div>${label}</div></div>`;
  }).join("");
}

function renderScore(){
  const el = document.getElementById("scoreDisplay");
  if(el) el.textContent = `${state.score} / ${state.maxScore}`;
}

function renderGame(){
  const c = getActiveCase();
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="layout">
      <aside class="chart" id="chartAside">
        <div class="chart-head">
          <span>Historia clínica</span>
          <div class="head-actions">
            <span class="toggle" id="toggleBtn">Ver detalle ▾</span>
            <span class="back" id="backBtn">← casos</span>
          </div>
        </div>
        <div class="chart-body">
          <div class="patient-row"><b>Paciente:</b> ${c.patient}</div>
          <div class="vitals" id="vitals"></div>
          <div class="timeline" id="timeline"></div>
          <div class="score-box"><span>Puntaje clínico</span><b id="scoreDisplay">0 / 0</b></div>
        </div>
      </aside>
      <main class="panel" id="panel"></main>
    </div>
  `;
  document.getElementById("backBtn").onclick = () => renderCaseSelect(activeCancer, activeModule);
  const chartAside = document.getElementById("chartAside");
  const toggleBtn = document.getElementById("toggleBtn");
  toggleBtn.onclick = () => {
    chartAside.classList.toggle("open");
    toggleBtn.textContent = chartAside.classList.contains("open") ? "Ocultar ▲" : "Ver detalle ▾";
  };
  render();
}

function render(){
  const s = stages[state.step];
  if(s.vitalsUpdate) Object.assign(state.vitals, s.vitalsUpdate);
  renderVitals();
  renderTimeline(s.phase);
  renderScore();

  const panel = document.getElementById("panel");
  const isTox = s.eyebrow && s.eyebrow.toLowerCase().includes("toxicidad");

  if(s.type === "info"){
    panel.innerHTML = `
      <div class="eyebrow ${isTox ? "tox":""}">${s.eyebrow}</div>
      <div class="narrative">${s.html}</div>
      <button class="next-btn" id="nextBtn">${s.buttonLabel}</button>
    `;
    document.getElementById("nextBtn").onclick = () => { state.step++; render(); };
    return;
  }

  if(s.type === "decision"){
    currentOptions = shuffleArray(s.options);
    state.answered = false;
    const letters = ["A","B","C","D"];
    panel.innerHTML = `
      <div class="eyebrow ${isTox ? "tox":""}">${s.eyebrow}</div>
      <div class="narrative"><p>${s.prompt}</p></div>
      <div class="options" id="optionsWrap">
        ${currentOptions.map((o,i) => `
          <button class="opt" data-i="${i}">
            <span class="letter">${letters[i]}</span>
            <span>${o.label}</span>
          </button>
        `).join("")}
      </div>
      <div id="feedbackWrap"></div>
    `;
    document.querySelectorAll(".opt").forEach(btn => {
      btn.onclick = () => selectOption(parseInt(btn.dataset.i));
    });
    return;
  }

  if(s.type === "epicrisis"){
    saveResult();
    const c = getActiveCase();
    const pct = Math.round((state.score/state.maxScore)*100);
    let grade = "Manejo subóptimo — revisar guías";
    if(pct >= 90) grade = "Manejo alineado con guías actuales";
    else if(pct >= 70) grade = "Buen manejo, con oportunidades de ajuste";
    panel.innerHTML = `
      <div class="eyebrow">Epicrisis</div>
      <div class="epicrisis">
        <h2>${c.patient.split("·")[0].trim()} — ${CANCER[activeCancer].modules[activeModule].title}</h2>
        <p style="color:var(--ink-soft);font-size:14px;">${c.label} · ${CANCER[activeCancer].label}</p>
        <div class="grade">${state.score} / ${state.maxScore}</div>
        <p>${grade}</p>
      </div>
      <button class="next-btn" id="retryBtn">Repetir este caso</button>
      <button class="ghost-btn" id="otherCaseBtn">Elegir otro caso</button>
      <button class="ghost-btn" id="homeBtn">Elegir otro tipo de cáncer</button>
    `;
    document.getElementById("retryBtn").onclick = () => startCase(activeCancer, activeModule, activeCaseKey);
    document.getElementById("otherCaseBtn").onclick = () => renderCaseSelect(activeCancer, activeModule);
    document.getElementById("homeBtn").onclick = goHome;
  }
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function tierOf(points){
  if(points >= 2) return "correct";
  if(points === 1) return "partial";
  return "incorrect";
}
function tierHeader(tier){
  if(tier === "correct") return "Conducta óptima";
  if(tier === "partial") return "Conducta aceptable, no la de primera elección";
  return "Revisar conducta";
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  const opts = currentOptions;
  const chosen = opts[i];
  const tier = tierOf(chosen.points);
  state.score += chosen.points;
  state.maxScore += 2;
  renderScore();

  document.querySelectorAll(".opt").forEach((btn,idx) => {
    btn.disabled = true;
    if(idx === i){
      btn.classList.add(tier);
    } else {
      btn.classList.add("neutral-off");
    }
  });

  const evidenceHtml = chosen.paper && chosen.paper !== "—" ? `
    <div class="evidence">
      <span class="ev-label">Fundamento científico</span>
      <span class="ev-study">${chosen.paper}</span> — ${chosen.finding}
    </div>` : "";

  let bestRefHtml = "";
  if(tier !== "correct"){
    const bestIdx = opts.findIndex(o => o.points >= 2);
    if(bestIdx !== -1){
      const letters = ["A","B","C","D"];
      bestRefHtml = `<div class="bestref">La opción con mayor respaldo en este escenario era <b>${letters[bestIdx]}. ${opts[bestIdx].label}</b>.</div>`;
    }
  }

  const fb = document.getElementById("feedbackWrap");
  fb.innerHTML = `
    <div class="feedback ${tier}">
      <span class="tag2">${tierHeader(tier)} · ${chosen.points}/2 pts</span>
      ${chosen.feedback}
    </div>
    ${evidenceHtml}
    ${bestRefHtml}
    <button class="next-btn" id="nextBtn">Continuar →</button>
  `;
  document.getElementById("nextBtn").onclick = () => {
    state.step++;
    if(state.step >= stages.length){
      stages.push({type:"epicrisis"});
    }
    render();
  };
}

document.getElementById("titleHome").onclick = goHome;

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.update().catch(() => {});
    }).catch(() => {});
  });

  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
